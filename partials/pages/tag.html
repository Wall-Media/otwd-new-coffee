<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}} · Notes · Off The Wall Digital</title>
<meta name="description" content="All notes tagged with {{name}}, from Petro Wall in Ramsgate.">
<link rel="canonical" href="https://www.offthewalldigital.com/blog/tag/{{slug}}">
<meta name="robots" content="index,follow">
<meta property="og:type" content="website">
<meta property="og:title" content="{{name}} · Notes · Off The Wall Digital">
<meta property="og:description" content="All notes tagged with {{name}}, from Petro Wall in Ramsgate.">
<meta property="og:url" content="https://www.offthewalldigital.com/blog/tag/{{slug}}">
<meta property="og:locale" content="en_GB">
<meta property="og:image" content="https://www.offthewalldigital.com/assets/img/share-shopfront.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{name}} · Notes · Off The Wall Digital">
<meta name="twitter:description" content="All notes tagged with {{name}}, from Petro Wall in Ramsgate.">
<meta name="twitter:image" content="https://www.offthewalldigital.com/assets/img/share-shopfront.jpg">
<link rel="alternate" type="application/rss+xml" title="Off The Wall Digital Notes" href="/rss.xml">
<!-- block:fonts -->
<!-- /block:fonts -->
<!-- block:favicon --><!-- /block:favicon -->
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/notes.css">
<link rel="stylesheet" href="/assets/css/notes-list.css">
<style>
.kicker{display:inline-flex;align-items:center;gap:9px;font-size:.7rem;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);background:rgba(109,115,96,.1);border:1px solid rgba(109,115,96,.18);padding:7px 15px;border-radius:999px}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.hero h1{font-size:clamp(2.2rem,4.8vw,2.8rem);margin:22px 0 14px;font-variation-settings:"SOFT" 40,"WONK" 1}
.hero p{font-size:1.05rem;color:var(--muted);max-width:38em;margin:0}
</style>
</head>
<body>
<!-- block:notes-header back_href="/blog" back_label="All notes" -->
<!-- /block:notes-header -->

<main>
  <div class="wrap hero">
    <span class="kicker"><i aria-hidden="true"></i>Tag</span>
    <h1>Notes tagged with {{name}}</h1>
    <p>Showing all notes that cover this topic.</p>
  </div>

  <div class="wrap posts">
<!-- block:post-cards tag="{{slug}}" -->
<!-- /block:post-cards -->
  </div>
</main>

<!-- block:notes-footer -->
<!-- /block:notes-footer -->

<script>
(function(){
  var ys=document.querySelectorAll('.yr');
  for(var i=0;i<ys.length;i++){ys[i].textContent=new Date().getFullYear();}
})();
</script>
</body>
</html>
